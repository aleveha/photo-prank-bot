services:
  next:
    container_name: nextjs-bun-app
    image: nextjs-bun-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    environment:
      ADMIN_SERVICE_API_KEY: ${ADMIN_SERVICE_API_KEY}
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL}
      APP_URL: ${APP_URL}
      DATABASE_URL: ${DATABASE_URL}
      FLYER_API_KEY: ${FLYER_API_KEY}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: photo-prank-bot_postgres
    environment:
      POSTGRES_USER: "photo-prank-bot"
      POSTGRES_PASSWORD: "photo-prank-bot"
      POSTGRES_DB: "photo-prank-bot"
    ports:
      - "5433:5432"
    volumes:
      - postgres:/data/postgres

volumes:
  postgres:
